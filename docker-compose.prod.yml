version: '3.8'

services:
  # ==========================================
  # Backend - NestJS (Production Container)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: phoneshop_backend_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
