version: '3.8'

services:
  # ==========================================
  # Redis
  # Used for caching, rate limiting, idempotency & background jobs
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: mobile_commerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend - NestJS
  # ==========================================
  backend:
    # Use image and volume mapping for hot-reloading in dev
    image: node:22-alpine
    container_name: mobile_commerce_backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # Start command for NestJS development
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # Frontend - React
  # ==========================================
  frontend:
    # Use image and volume mapping for hot-reloading in dev
    image: node:22-alpine
    container_name: mobile_commerce_frontend
    working_dir: /app
    ports:
      - "5173:5173" # Update to 3000 if using Create React App instead of Vite
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
      # For Vite, expose the port
      - VITE_API_URL=http://localhost:3000
    # Start command for Vite development
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
