version: '3.8'

services:
  # ==========================================
  # Redis
  # Used for caching, rate limiting, idempotency & background jobs
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: mobile_commerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend - NestJS (Development with Hot Reload)
  # ==========================================
  backend:
    image: node:22-alpine
    container_name: mobile_commerce_backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  backend_node_modules:
