name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mobilecommerce_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mobilecommerce_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_only@localhost:5432/mobilecommerce_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm install -g npm@11 && npm ci

      - name: Production dependency security audit
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run build & typecheck
        working-directory: ./backend
        run: npm run build

      - name: Rehearse Prisma migration on disposable PostgreSQL
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Run automated tests
        working-directory: ./backend
        run: npm test

      - name: Run business lifecycle integration tests on disposable PostgreSQL
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres_ci_only@localhost:5432/mobilecommerce_ci
        run: npm run test:integration
